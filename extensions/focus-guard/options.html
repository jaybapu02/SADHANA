<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sadhana Focus Guard - Options</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #12161f; color: #e9edf5; max-width: 560px; margin: 40px auto; padding: 0 16px; }
    h1 { font-size: 22px; }
    label { display: block; margin: 16px 0 6px; font-weight: 600; }
    input[type=text], input[type=password] { width: 100%; padding: 10px; border-radius: 8px; border: 1px solid #2c3340; background: #1a2030; color: #e9edf5; }
    button { margin-top: 18px; padding: 10px 18px; border-radius: 8px; border: 0; background: #0d6efd; color: #fff; font-weight: 600; cursor: pointer; }
    button.secondary { background: #495057; margin-left: 8px; }
    .status { margin-top: 16px; padding: 10px; border-radius: 8px; }
    .ok { background: #0f5132; color: #d1e7dd; }
    .err { background: #842029; color: #f8d7da; }
    .hint { color: #9aa4b2; font-size: 13px; margin-top: 4px; }
  </style>
</head>
<body>
  <h1>Sadhana Focus Guard</h1>
  <p class="hint">Super Power Saving Mode enforcement. Points to your Sadhana server and authenticates with a device token generated in the Focus page ("Super Power Lock & Devices" panel).</p>

  <label for="serverUrl">Server URL</label>
  <input type="text" id="serverUrl" placeholder="http://127.0.0.1:8000">
  <div class="hint">Your Django server, e.g. http://127.0.0.1:8000</div>

  <label for="token">Device Token</label>
  <input type="password" id="token" placeholder="Paste your device token">

  <div>
    <button id="save">Save</button>
    <button id="test" class="secondary">Test connection</button>
  </div>
  <div id="status"></div>

  <script src="options.js"></script>
</body>
</html>
