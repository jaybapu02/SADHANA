<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Sadhana Focus Guard</title>
  <style>
    body { font-family: 'Segoe UI', sans-serif; background: #12161f; color: #e9edf5; width: 300px; padding: 16px; margin: 0; }
    h1 { font-size: 16px; margin: 0 0 4px; }
    .sub { color: #9aa4b2; font-size: 12px; margin-bottom: 12px; }
    .status-box { padding: 12px; border-radius: 10px; margin-bottom: 12px; text-align: center; }
    .active { background: #0f5132; color: #d1e7dd; }
    .locked { background: #7a1440; color: #f8d7da; }
    .idle { background: #1a2030; color: #9aa4b2; }
    .row { display: flex; justify-content: space-between; font-size: 13px; margin: 4px 0; }
    .row b { color: #fff; }
    .actions { margin-top: 12px; }
    button { width: 100%; padding: 8px; border-radius: 8px; border: 0; background: #0d6efd; color: #fff; font-weight: 600; cursor: pointer; margin-top: 6px; }
    button.secondary { background: #495057; }
    #options-link { display: block; text-align: center; margin-top: 8px; font-size: 12px; color: #9aa4b2; cursor: pointer; text-decoration: underline; }
  </style>
</head>
<body>
  <h1>Sadhana Focus Guard</h1>
  <div class="sub">Super Power Saving Mode</div>

  <div class="status-box idle" id="statusBox">
    <strong id="statusTitle">Checking...</strong>
  </div>

  <div id="details">
    <div class="row"><span>Task</span><b id="task">—</b></div>
    <div class="row"><span>Session</span><b id="sessionId">—</b></div>
    <div class="row"><span>Blocked attempts</span><b id="blocked">0</b></div>
    <div class="row"><span>Lock violations</span><b id="violations">0</b></div>
    <div class="row"><span>Device</span><b id="device">—</b></div>
  </div>

  <div class="actions">
    <button id="refresh">Refresh</button>
    <button id="openServer" class="secondary">Open Sadhana</button>
  </div>
  <a id="options-link">Options</a>

  <script src="popup.js"></script>
</body>
</html>
