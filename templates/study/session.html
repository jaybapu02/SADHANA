{% extends 'base.html' %}
{% block content %}
<div class="row mt-4">
    <div class="col-12 mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="fw-bold"><i class="fa-solid fa-clock text-primary me-2"></i>Study Session</h2>
            <a href="{% url 'dashboard_router' %}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
        </div>
        <hr>
    </div>
</div>

<div class="row justify-content-center">
    <div class="col-md-8">
        <div class="card shadow border-0 rounded-4">
            <div class="card-body p-4 text-center">
                <div class="mb-4">
                    <div class="display-1 fw-bold" id="timerDisplay">00:00</div>
                    <p class="text-muted">Elapsed Time</p>
                </div>

                <div class="row justify-content-center mb-4">
                    <div class="col-4">
                        <button id="startBtn" class="btn btn-success btn-lg rounded-pill px-4 w-100"><i class="fa-solid fa-play me-2"></i>Start</button>
                    </div>
                    <div class="col-4">
                        <button id="pauseBtn" class="btn btn-warning btn-lg rounded-pill px-4 w-100" disabled><i class="fa-solid fa-pause me-2"></i>Pause</button>
                    </div>
                    <div class="col-4">
                        <button id="endBtn" class="btn btn-danger btn-lg rounded-pill px-4 w-100" disabled><i class="fa-solid fa-stop me-2"></i>End</button>
                    </div>
                </div>

                <div class="row g-3 mt-4">
                    <div class="col-4">
                        <div class="card bg-secondary bg-opacity-10 border-0 rounded-3">
                            <div class="card-body py-2">
                                <h6 class="text-muted small mb-1">Break</h6>
                                <h4 class="fw-bold mb-0" id="breakDisplay">00:00</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card bg-secondary bg-opacity-10 border-0 rounded-3">
                            <div class="card-body py-2">
                                <h6 class="text-muted small mb-1">Distraction</h6>
                                <h4 class="fw-bold mb-0 text-danger" id="distractionDisplay">00:00</h4>
                            </div>
                        </div>
                    </div>
                    <div class="col-4">
                        <div class="card bg-secondary bg-opacity-10 border-0 rounded-3">
                            <div class="card-body py-2">
                                <h6 class="text-muted small mb-1">Focus Score</h6>
                                <h4 class="fw-bold mb-0 text-success" id="focusScoreDisplay">--</h4>
                            </div>
                        </div>
                    </div>
                </div>

                <div class="mt-4">
                    <button id="breakBtn" class="btn btn-outline-info rounded-pill me-2"><i class="fa-solid fa-mug-saucer me-1"></i> Take Break</button>
                    <button id="distractionBtn" class="btn btn-outline-danger rounded-pill"><i class="fa-solid fa-eye-slash me-1"></i> Mark Distracted</button>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
    let timerInterval = null;
    let breakInterval = null;
    let distractionInterval = null;
    let seconds = 0;
    let breakSeconds = 0;
    let distractionSeconds = 0;
    let isRunning = false;
    let isPaused = false;
    let isBreak = false;
    let isDistracted = false;

    const timerDisplay = document.getElementById('timerDisplay');
    const breakDisplay = document.getElementById('breakDisplay');
    const distractionDisplay = document.getElementById('distractionDisplay');
    const focusScoreDisplay = document.getElementById('focusScoreDisplay');

    const startBtn = document.getElementById('startBtn');
    const pauseBtn = document.getElementById('pauseBtn');
    const endBtn = document.getElementById('endBtn');
    const breakBtn = document.getElementById('breakBtn');
    const distractionBtn = document.getElementById('distractionBtn');

    function formatTime(totalSeconds) {
        const m = String(Math.floor(totalSeconds / 60)).padStart(2, '0');
        const s = String(totalSeconds % 60).padStart(2, '0');
        return `${m}:${s}`;
    }

    function updateDisplays() {
        timerDisplay.textContent = formatTime(seconds);
        breakDisplay.textContent = formatTime(breakSeconds);
        distractionDisplay.textContent = formatTime(distractionSeconds);
    }

    function updateStartButton() {
        if (seconds > 0) {
            startBtn.innerHTML = '<i class="fa-solid fa-play me-2"></i>Resume';
        } else {
            startBtn.innerHTML = '<i class="fa-solid fa-play me-2"></i>Start';
        }
    }

    startBtn.addEventListener('click', () => {
        if (!isRunning) {
            isRunning = true;
            isPaused = false;
            resumeMainTimer();
            startBtn.disabled = true;
            pauseBtn.disabled = false;
            pauseBtn.innerHTML = '<i class="fa-solid fa-pause me-2"></i>Pause';
            endBtn.disabled = false;
            breakBtn.disabled = false;
            distractionBtn.disabled = false;
        }
    });

    function pauseAllIntervals() {
        clearInterval(timerInterval);
        if (breakInterval) {
            clearInterval(breakInterval);
            breakInterval = null;
        }
        if (distractionInterval) {
            clearInterval(distractionInterval);
            distractionInterval = null;
        }
    }

    function resumeMainTimer() {
        timerInterval = setInterval(() => {
            seconds++;
            updateDisplays();
        }, 1000);
        if (isBreak) {
            breakInterval = setInterval(() => { if (isBreak) breakSeconds++; }, 1000);
        }
        if (isDistracted) {
            distractionInterval = setInterval(() => { if (isDistracted) distractionSeconds++; }, 1000);
        }
    }

    pauseBtn.addEventListener('click', () => {
        if (isRunning && !isPaused) {
            pauseAllIntervals();
            isRunning = false;
            isPaused = true;
            pauseBtn.innerHTML = '<i class="fa-solid fa-play me-2"></i>Resume';
            pauseBtn.disabled = false;
            startBtn.disabled = true;
            breakBtn.disabled = true;
            distractionBtn.disabled = true;
            updateStartButton();
        } else if (isPaused) {
            isRunning = true;
            isPaused = false;
            resumeMainTimer();
            pauseBtn.innerHTML = '<i class="fa-solid fa-pause me-2"></i>Pause';
            breakBtn.disabled = false;
            distractionBtn.disabled = false;
        }
    });

    breakBtn.addEventListener('click', () => {
        if (!isRunning) return;
        isBreak = !isBreak;
        breakBtn.classList.toggle('btn-info', isBreak);
        breakBtn.classList.toggle('btn-secondary', !isBreak);
        if (isBreak) {
            breakBtn.innerHTML = '<i class="fa-solid fa-mug-saucer me-1"></i> Back to Study';
            if (!breakInterval) {
                breakInterval = setInterval(() => { if (isBreak) breakSeconds++; }, 1000);
            }
        } else {
            breakBtn.innerHTML = '<i class="fa-solid fa-mug-saucer me-1"></i> Take Break';
            if (breakInterval) {
                clearInterval(breakInterval);
                breakInterval = null;
            }
        }
    });

    distractionBtn.addEventListener('click', () => {
        if (!isRunning) return;
        isDistracted = !isDistracted;
        distractionBtn.classList.toggle('btn-outline-danger', !isDistracted);
        distractionBtn.classList.toggle('btn-danger', isDistracted);
        if (isDistracted) {
            distractionBtn.innerHTML = '<i class="fa-solid fa-eye me-1"></i> Focus Back';
            if (!distractionInterval) {
                distractionInterval = setInterval(() => { if (isDistracted) distractionSeconds++; }, 1000);
            }
        } else {
            distractionBtn.innerHTML = '<i class="fa-solid fa-eye-slash me-1"></i> Mark Distracted';
            if (distractionInterval) {
                clearInterval(distractionInterval);
                distractionInterval = null;
            }
        }
    });

    function getCookie(name) {
        let cookieValue = null;
        if (document.cookie && document.cookie !== '') {
            document.cookie.split(';').forEach(c => {
                const trimmed = c.trim();
                if (trimmed.startsWith(name + '=')) {
                    cookieValue = decodeURIComponent(trimmed.substring(name.length + 1));
                }
            });
        }
        return cookieValue;
    }

    endBtn.addEventListener('click', () => {
        if (!isRunning && seconds === 0) return;
        pauseAllIntervals();
        isRunning = false;
        isPaused = false;

        const durationMinutes = Math.round(seconds / 60);
        const breakMinutes = Math.round(breakSeconds / 60);

        fetch('/study/save-session/', {
            method: 'POST',
            headers: {
                'Content-Type': 'application/json',
                'X-CSRFToken': getCookie('csrftoken')
            },
            body: JSON.stringify({
                duration_minutes: durationMinutes,
                break_minutes: breakMinutes,
                distraction_seconds: distractionSeconds
            })
        })
        .then(r => r.json())
        .then(data => {
            if (data.status === 'success') {
                focusScoreDisplay.textContent = data.focus_score + '%';
                alert(`Session saved! Focus Score: ${data.focus_score}%`);
            } else {
                alert('Error: ' + data.message);
            }
        })
        .catch(err => alert('Error saving session.'))
        .finally(() => {
            startBtn.disabled = true;
            startBtn.innerHTML = '<i class="fa-solid fa-play me-2"></i>Start';
            pauseBtn.disabled = true;
            pauseBtn.innerHTML = '<i class="fa-solid fa-pause me-2"></i>Pause';
            endBtn.disabled = true;
            breakBtn.disabled = true;
            distractionBtn.disabled = true;
        });
    });
</script>
{% endblock %}
