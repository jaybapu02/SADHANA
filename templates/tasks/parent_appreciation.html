{% extends 'base.html' %}
{% block title %}Send Appreciation - Sadhana{% endblock %}
{% block topbar_title %}Send Appreciation{% endblock %}

{% block content %}
<a href="{% url 'parent_child_todo' child.id %}" class="sd-breadcrumb"><i class="fa-solid fa-arrow-left"></i> Back</a>

<div class="row">
    <div class="col-md-8 col-lg-6 mx-auto">
        <div class="card">
            <div class="card-body p-4 text-center">
                <span class="stat-icon tint-warning mx-auto mb-3" style="width:64px;height:64px;font-size:1.6rem;border-radius:20px;background:rgba(245,183,61,.15);color:var(--sd-warning);"><i class="fa-solid fa-star"></i></span>
                <h4>Appreciate {{ child.username }}</h4>
                <p class="text-muted small">Send an encouraging message to your child.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3 text-start">
                        <textarea class="form-control" name="message" rows="3" placeholder="Write your appreciation message..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-gradient w-100"><i class="fa-solid fa-paper-plane me-1"></i> Send Appreciation</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
