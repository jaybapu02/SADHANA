{% extends 'base.html' %}
{% block content %}
<div class="row mt-4">
    <div class="col-12 mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="fw-bold"><i class="fa-solid fa-heart text-success me-2"></i> Send Appreciation</h2>
            <a href="{% url 'parent_child_todo' child.id %}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
        </div>
        <hr>
    </div>

    <div class="col-md-6 mx-auto">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4 text-center">
                <i class="fa-solid fa-star fa-4x text-warning mb-3"></i>
                <h5>Appreciate {{ child.username }}</h5>
                <p class="text-muted small">Send an encouraging message to your child.</p>
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <textarea class="form-control" name="message" rows="3" placeholder="Write your appreciation message..." required></textarea>
                    </div>
                    <button type="submit" class="btn btn-success w-100"><i class="fa-solid fa-paper-plane me-1"></i> Send Appreciation</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
