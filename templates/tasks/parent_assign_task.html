{% extends 'base.html' %}
{% block content %}
<div class="row mt-4">
    <div class="col-md-8 mx-auto">
        <div class="d-flex justify-content-between align-items-center mb-3">
            <h2 class="fw-bold"><i class="fa-solid fa-plus-circle text-primary me-2"></i>Assign Task to {{ child.username }}</h2>
            <a href="{% url 'parent_child_todo' child.id %}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
        </div>
        <hr>
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-medium">Task Name</label>
                        <input type="text" class="form-control form-control-lg" name="task_name" placeholder="e.g. Complete Mathematics Chapter 5" required>
                    </div>
                    <div class="row g-3 mb-3">
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Priority</label>
                            <select class="form-select" name="priority">
                                <option value="HIGH">High</option>
                                <option value="MEDIUM" selected>Medium</option>
                                <option value="LOW">Low</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label fw-medium">Due Date (optional)</label>
                            <input type="date" class="form-control" name="due_date">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 btn-lg">Assign Task</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
