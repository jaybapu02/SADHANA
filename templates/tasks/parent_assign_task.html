{% extends 'base.html' %}
{% block title %}Assign Task - Sadhana{% endblock %}
{% block topbar_title %}Assign Task{% endblock %}

{% block content %}
<a href="{% url 'parent_child_todo' child.id %}" class="sd-breadcrumb"><i class="fa-solid fa-arrow-left"></i> Back</a>

<div class="sd-page-header">
    <div>
        <h2 class="sd-page-title"><span class="sd-title-icon"><i class="fa-solid fa-plus"></i></span> Assign Task to {{ child.username }}</h2>
        <p class="sd-page-subtitle">This task will appear in your child's To-Do list.</p>
    </div>
</div>

<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="card">
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Task Name</label>
                        <input type="text" class="form-control form-control-lg" name="task_name" placeholder="e.g. Complete Mathematics Chapter 5" required>
                    </div>
                    <div class="row g-3 mb-4">
                        <div class="col-md-6">
                            <label class="form-label">Priority</label>
                            <select class="form-select" name="priority">
                                <option value="HIGH">High</option>
                                <option value="MEDIUM" selected>Medium</option>
                                <option value="LOW">Low</option>
                            </select>
                        </div>
                        <div class="col-md-6">
                            <label class="form-label">Due Date (optional)</label>
                            <input type="date" class="form-control" name="due_date">
                        </div>
                    </div>
                    <button type="submit" class="btn btn-gradient w-100 btn-lg"><i class="fa-solid fa-paper-plane me-2"></i>Assign Task</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
