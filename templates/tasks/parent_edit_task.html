{% extends 'base.html' %}
{% block content %}
<div class="row mt-4">
    <div class="col-12 mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="fw-bold"><i class="fa-solid fa-pen text-primary me-2"></i> Edit Task</h2>
            <a href="{% url 'parent_child_todo' child.id %}" class="btn btn-outline-secondary btn-sm"><i class="fa-solid fa-arrow-left me-1"></i> Back</a>
        </div>
        <hr>
    </div>

    <div class="col-md-6 mx-auto">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label text-muted small">Task Name</label>
                        <input type="text" class="form-control" name="task_name" value="{{ edit_task.task_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Priority</label>
                        <select class="form-select" name="priority">
                            <option value="HIGH" {% if edit_task.priority == 'HIGH' %}selected{% endif %}>High</option>
                            <option value="MEDIUM" {% if edit_task.priority == 'MEDIUM' %}selected{% endif %}>Medium</option>
                            <option value="LOW" {% if edit_task.priority == 'LOW' %}selected{% endif %}>Low</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label text-muted small">Due Date</label>
                        <input type="date" class="form-control" name="due_date" value="{{ edit_task.due_date|date:'Y-m-d' }}">
                    </div>
                    <button type="submit" class="btn btn-primary w-100">Update Task</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
