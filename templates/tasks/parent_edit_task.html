{% extends 'base.html' %}
{% block title %}Edit Task - Sadhana{% endblock %}
{% block topbar_title %}Edit Task{% endblock %}

{% block content %}
<a href="{% url 'parent_child_todo' child.id %}" class="sd-breadcrumb"><i class="fa-solid fa-arrow-left"></i> Back</a>

<div class="sd-page-header">
    <div>
        <h2 class="sd-page-title"><span class="sd-title-icon"><i class="fa-solid fa-pen"></i></span> Edit Task</h2>
    </div>
</div>

<div class="row">
    <div class="col-md-8 col-lg-6 mx-auto">
        <div class="card">
            <div class="card-body p-4">
                <form method="POST">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Task Name</label>
                        <input type="text" class="form-control" name="task_name" value="{{ edit_task.task_name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Priority</label>
                        <select class="form-select" name="priority">
                            <option value="HIGH" {% if edit_task.priority == 'HIGH' %}selected{% endif %}>High</option>
                            <option value="MEDIUM" {% if edit_task.priority == 'MEDIUM' %}selected{% endif %}>Medium</option>
                            <option value="LOW" {% if edit_task.priority == 'LOW' %}selected{% endif %}>Low</option>
                        </select>
                    </div>
                    <div class="mb-4">
                        <label class="form-label">Due Date</label>
                        <input type="date" class="form-control" name="due_date" value="{{ edit_task.due_date|date:'Y-m-d' }}">
                    </div>
                    <button type="submit" class="btn btn-gradient w-100"><i class="fa-solid fa-floppy-disk me-1"></i> Update Task</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
