{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><i class="fa-solid fa-pen"></i> Edit Blacklist Item: {{ item.name }}</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Name</label>
                        <input type="text" name="name" class="form-control" value="{{ item.name }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Category</label>
                        <select name="category" class="form-select">
                            <option value="APP" {% if item.category == 'APP' %}selected{% endif %}>Application</option>
                            <option value="WEBSITE" {% if item.category == 'WEBSITE' %}selected{% endif %}>Website</option>
                        </select>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">URL Pattern (for websites)</label>
                        <input type="text" name="url_pattern" class="form-control" value="{{ item.url_pattern|default:'' }}" placeholder="e.g. instagram.com">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">App Name (for applications)</label>
                        <input type="text" name="app_name" class="form-control" value="{{ item.app_name|default:'' }}" placeholder="e.g. Discord.exe">
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{% url 'admin_list_blacklist' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
