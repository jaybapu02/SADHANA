{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><i class="fa-solid fa-pen"></i> Edit Connection: {{ conn.parent.username }} ↔ {{ conn.child.username }}</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="PENDING" {% if conn.status == 'PENDING' %}selected{% endif %}>Pending</option>
                            <option value="ACCEPTED" {% if conn.status == 'ACCEPTED' %}selected{% endif %}>Accepted</option>
                            <option value="REJECTED" {% if conn.status == 'REJECTED' %}selected{% endif %}>Rejected</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{% url 'admin_list_connections' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
