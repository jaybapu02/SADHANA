{% extends 'base.html' %}
{% block title %}Confirm Delete - Admin{% endblock %}
{% block topbar_title %}Confirm Delete{% endblock %}

{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card border-danger-subtle">
            <div class="card-body p-4 text-center">
                <span class="stat-icon tint-danger mx-auto mb-3" style="width:64px;height:64px;font-size:1.5rem;border-radius:20px;"><i class="fa-solid fa-triangle-exclamation"></i></span>
                <h4>Confirm Delete</h4>
                <p class="mb-1">Are you sure you want to delete this {{ label }}?</p>
                <p class="text-muted small">{{ obj }}</p>
                <form method="post" class="mt-4">
                    {% csrf_token %}
                    <div class="d-flex gap-2 justify-content-center">
                        <button type="submit" class="btn btn-danger"><i class="fa-solid fa-trash-can me-1"></i> Delete</button>
                        <a href="javascript:history.back()" class="btn btn-outline-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
