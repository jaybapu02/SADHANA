{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><i class="fa-solid fa-pen"></i> Edit User: {{ user_obj.username }}</div>
            <div class="card-body">
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Username</label>
                        <input type="text" name="username" class="form-control" value="{{ user_obj.username }}" required>
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Email</label>
                        <input type="email" name="email" class="form-control" value="{{ user_obj.email|default:'' }}">
                    </div>
                    <div class="mb-3">
                        <label class="form-label">Role</label>
                        <select name="role" class="form-select">
                            <option value="CHILD" {% if user_obj.role == 'CHILD' %}selected{% endif %}>Child</option>
                            <option value="PARENT" {% if user_obj.role == 'PARENT' %}selected{% endif %}>Parent</option>
                            <option value="ADMIN" {% if user_obj.role == 'ADMIN' %}selected{% endif %}>Admin</option>
                        </select>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" name="is_active" class="form-check-input" id="id_active" {% if user_obj.is_active %}checked{% endif %}>
                        <label class="form-check-label" for="id_active">Active</label>
                    </div>
                    <div class="form-check mb-3">
                        <input type="checkbox" name="is_staff" class="form-check-input" id="id_staff" {% if user_obj.is_staff %}checked{% endif %}>
                        <label class="form-check-label" for="id_staff">Staff (Django admin access)</label>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{% url 'admin_list_users' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
