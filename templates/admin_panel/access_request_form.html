{% extends 'base.html' %}
{% block content %}
<div class="row justify-content-center">
    <div class="col-md-6">
        <div class="card">
            <div class="card-header"><i class="fa-solid fa-pen"></i> Edit Access Request #{{ req.id }}</div>
            <div class="card-body">
                <div class="mb-3">
                    <label class="form-label fw-semibold">Child</label>
                    <p class="form-control-plaintext">{{ req.child.username }}</p>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Parent</label>
                    <p class="form-control-plaintext">{{ req.parent.username }}</p>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Requested App</label>
                    <p class="form-control-plaintext">{{ req.blacklist_item.name }}</p>
                </div>
                <div class="mb-3">
                    <label class="form-label fw-semibold">Focus Session</label>
                    <p class="form-control-plaintext">#{{ req.session.id }} — {{ req.session.planned_duration }} min</p>
                </div>
                <form method="post">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label">Status</label>
                        <select name="status" class="form-select">
                            <option value="PENDING" {% if req.status == 'PENDING' %}selected{% endif %}>Pending</option>
                            <option value="APPROVED" {% if req.status == 'APPROVED' %}selected{% endif %}>Approved</option>
                            <option value="REJECTED" {% if req.status == 'REJECTED' %}selected{% endif %}>Rejected</option>
                            <option value="EXPIRED" {% if req.status == 'EXPIRED' %}selected{% endif %}>Expired</option>
                        </select>
                    </div>
                    <div class="d-flex gap-2">
                        <button type="submit" class="btn btn-primary">Save</button>
                        <a href="{% url 'admin_list_access_requests' %}" class="btn btn-secondary">Cancel</a>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
