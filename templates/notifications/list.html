{% extends 'base.html' %}
{% block title %}Notifications - Sadhana{% endblock %}
{% block topbar_title %}Notifications{% endblock %}

{% block content %}
<div class="sd-page-header">
    <div>
        <h2 class="sd-page-title"><span class="sd-title-icon" style="background:rgba(245,183,61,.15);color:var(--sd-warning);"><i class="fa-solid fa-bell"></i></span> Notifications</h2>
    </div>
    <div class="sd-page-actions">
        <button id="markAllReadBtn" class="btn btn-gradient" style="display:none;">
            <i class="fa-solid fa-check-double me-1"></i> Mark All Read
        </button>
        <a href="{% url 'dashboard_router' %}" class="btn btn-outline-secondary">
            <i class="fa-solid fa-arrow-left me-1"></i> Back
        </a>
    </div>
</div>

<div class="row">
    <div class="col-lg-8 mx-auto">
        <div class="card">
            <div class="card-body p-2 p-md-3">
                <div id="unreadAlert" class="alert alert-info d-flex align-items-center mx-1 mt-1" style="display:none;">
                    <i class="fa-solid fa-circle-info me-2"></i>
                    <div>You have <strong id="unreadCountDisplay">0</strong> unread notification(s).</div>
                </div>

                <div id="notificationList">
                    <div class="loading-state" id="loadingState">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>

                <div class="empty-state" id="emptyState" style="display:none;">
                    <span class="es-icon"><i class="fa-solid fa-bell-slash"></i></span>
                    <p class="es-text">No notifications yet.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentUserId = {{ request.user.id }};
let currentUnread = 0;
const deletingIds = new Set();

function setUnreadBadge(count) {
    const badge = document.getElementById('navbarUnreadBadge');
    if (!badge) return;
    if (count > 0) {
        badge.textContent = count;
        badge.style.display = 'inline';
    } else {
        badge.style.display = 'none';
    }
}

function renderUnreadState(unread) {
    currentUnread = unread;
    const unreadAlert = document.getElementById('unreadAlert');
    const unreadCountDisplay = document.getElementById('unreadCountDisplay');
    const markAllBtn = document.getElementById('markAllReadBtn');

    if (unread > 0) {
        unreadAlert.style.display = 'flex';
        unreadCountDisplay.textContent = unread;
        markAllBtn.style.display = 'inline-block';
    } else {
        unreadAlert.style.display = 'none';
        markAllBtn.style.display = 'none';
    }
    setUnreadBadge(unread);
}

function fetchNotifications() {
    fetch('{% url "api_notifications" %}')
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('notificationList');
            const emptyState = document.getElementById('emptyState');
            const loadingState = document.getElementById('loadingState');

            const visible = data.notifications.filter(n => !deletingIds.has(String(n.id)));

            if (data.count === 0 || (visible.length === 0 && deletingIds.size === 0)) {
                loadingState.style.display = 'none';
                container.innerHTML = '';
                emptyState.style.display = 'block';
                renderUnreadState(0);
                return;
            }

            emptyState.style.display = 'none';
            loadingState.style.display = 'none';

            renderUnreadState(visible.filter(n => !n.is_read).length);

            let html = '';
            visible.forEach(n => {
                const timeAgo = timeSince(n.timestamp);
                const unreadClass = n.is_read ? '' : 'unread';
                const badgeHtml = n.is_read ? '' : '<span class="badge soft-primary">New</span>';

                html += `
                    <div class="notif-row ${unreadClass}" data-id="${n.id}">
                        <span class="notif-icon"><i class="fa-solid fa-bell"></i></span>
                        <div class="flex-grow-1 min-w-0">
                            <div class="d-flex align-items-center gap-2 mb-1 flex-wrap">
                                ${badgeHtml}
                                <small class="text-muted">${timeAgo} ago</small>
                                <span class="badge soft-info text-capitalize">${escapeHtml(n.notification_type.replace(/_/g, ' '))}</span>
                            </div>
                            <p class="mb-0 small">${escapeHtml(n.message)}</p>
                        </div>
                        <div class="d-flex gap-1">
                            ${n.is_read ? '' : `<button class="btn btn-action btn-outline-secondary mark-read-btn" data-id="${n.id}" title="Mark as read"><i class="fa-solid fa-check"></i></button>`}
                            <button class="btn btn-action btn-outline-danger delete-btn" data-id="${n.id}" title="Delete"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;
        })
        .catch(() => {
            showToast('Could not load notifications.', 'error');
        });
}

// ---- Event delegation (attached once; survives list re-renders) ----

document.getElementById('notificationList').addEventListener('click', function(e) {
    const deleteBtn = e.target.closest('.delete-btn');
    if (deleteBtn) {
        deleteNotification(deleteBtn);
        return;
    }
    const markReadBtn = e.target.closest('.mark-read-btn');
    if (markReadBtn) {
        markNotificationRead(markReadBtn);
    }
});

function deleteNotification(btn) {
    const id = String(btn.dataset.id);
    const row = btn.closest('.notif-row');
    if (deletingIds.has(id)) return;
    deletingIds.add(id);

    // Optimistic UI: fade the row out immediately.
    if (row) {
        row.style.transition = 'opacity .2s ease, transform .2s ease';
        row.style.opacity = '0';
        row.style.transform = 'translateX(16px)';
        setTimeout(() => row.remove(), 200);
    }

    // Instantly reflect the count change if this was an unread notification.
    if (row && row.classList.contains('unread')) {
        renderUnreadState(Math.max(0, currentUnread - 1));
    }

    fetch(`/notifications/api/delete/${id}/`, {
        method: 'DELETE',
        headers: {
            'X-CSRFToken': getCSRF(),
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(({ ok, data }) => {
            deletingIds.delete(id);
            if (!ok) throw new Error(data.message || 'Failed to delete notification.');
            // Sync every unread counter with the authoritative backend value.
            renderUnreadState(data.unread_count);
            showToast('Notification deleted.', 'success');
            maybeShowEmptyState();
        })
        .catch(err => {
            deletingIds.delete(id);
            showToast(err.message || 'Failed to delete notification.', 'error');
            fetchNotifications(); // Restore the row / resync with backend state.
        });
}

function markNotificationRead(btn) {
    const id = btn.dataset.id;
    btn.disabled = true;
    fetch(`/notifications/api/mark-read/${id}/`, {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCSRF(),
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(({ ok, data }) => {
            if (!ok) throw new Error(data.message || 'Failed to mark as read.');
            renderUnreadState(data.unread_count);
            fetchNotifications();
        })
        .catch(err => {
            btn.disabled = false;
            showToast(err.message || 'Failed to mark as read.', 'error');
        });
}

document.getElementById('markAllReadBtn').addEventListener('click', function() {
    const btn = this;
    btn.disabled = true;
    fetch('{% url "api_mark_all_read" %}', {
        method: 'POST',
        headers: {
            'X-CSRFToken': getCSRF(),
            'X-Requested-With': 'XMLHttpRequest'
        }
    })
        .then(r => r.json().then(data => ({ ok: r.ok, data })))
        .then(({ ok, data }) => {
            btn.disabled = false;
            if (!ok) throw new Error(data.message || 'Failed to mark all as read.');
            renderUnreadState(data.unread_count);
            fetchNotifications();
            showToast('All notifications marked as read.', 'success');
        })
        .catch(err => {
            btn.disabled = false;
            showToast(err.message || 'Failed to mark all as read.', 'error');
        });
});

function maybeShowEmptyState() {
    const container = document.getElementById('notificationList');
    const rows = container.querySelectorAll('.notif-row');
    if (rows.length === 0 && deletingIds.size === 0) {
        container.innerHTML = '';
        document.getElementById('emptyState').style.display = 'block';
    }
}

function timeSince(isoString) {
    const now = new Date();
    const then = new Date(isoString);
    const seconds = Math.floor((now - then) / 1000);
    if (seconds < 60) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + 'm';
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + 'h';
    const days = Math.floor(hours / 24);
    if (days < 30) return days + 'd';
    return Math.floor(days / 30) + 'mo';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function getCSRF() {
    const name = 'csrftoken';
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        document.cookie.split(';').forEach(c => {
            const trimmed = c.trim();
            if (trimmed.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(trimmed.substring(name.length + 1));
            }
        });
    }
    return cookieValue;
}

fetchNotifications();
setInterval(fetchNotifications, 10000);
</script>
{% endblock %}
