{% extends 'base.html' %}
{% block content %}
<div class="row mt-4">
    <div class="col-12 mb-4">
        <div class="d-flex justify-content-between align-items-center">
            <h2 class="fw-bold"><i class="fa-solid fa-bell text-warning me-2"></i>Notifications</h2>
            <div>
                <button id="markAllReadBtn" class="btn btn-outline-primary btn-sm" style="display:none;">
                    <i class="fa-solid fa-check-double me-1"></i> Mark All Read
                </button>
                <a href="{% url 'dashboard_router' %}" class="btn btn-outline-secondary btn-sm ms-2">
                    <i class="fa-solid fa-arrow-left me-1"></i> Back
                </a>
            </div>
        </div>
        <hr>
    </div>

    <div class="col-md-8 mx-auto">
        <div class="card shadow-sm border-0 rounded-4">
            <div class="card-body">
                <div id="unreadAlert" class="alert alert-info d-flex align-items-center" style="display:none;">
                    <i class="fa-solid fa-circle-info me-2"></i>
                    You have <strong id="unreadCountDisplay">0</strong> unread notification(s).
                </div>

                <div id="notificationList" class="list-group list-group-flush">
                    <div class="text-center py-5" id="loadingState">
                        <div class="spinner-border text-primary" role="status">
                            <span class="visually-hidden">Loading...</span>
                        </div>
                    </div>
                </div>

                <div class="text-center py-5" id="emptyState" style="display:none;">
                    <i class="fa-solid fa-bell-slash text-muted fa-4x mb-3"></i>
                    <p class="text-muted">No notifications yet.</p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}

{% block extra_js %}
<script>
let currentUserId = {{ request.user.id }};

function fetchNotifications() {
    fetch('{% url "api_notifications" %}')
        .then(r => r.json())
        .then(data => {
            const container = document.getElementById('notificationList');
            const emptyState = document.getElementById('emptyState');
            const loadingState = document.getElementById('loadingState');
            const unreadAlert = document.getElementById('unreadAlert');
            const unreadCountDisplay = document.getElementById('unreadCountDisplay');
            const markAllBtn = document.getElementById('markAllReadBtn');

            if (data.count === 0) {
                loadingState.style.display = 'none';
                container.innerHTML = '';
                emptyState.style.display = 'block';
                unreadAlert.style.display = 'none';
                markAllBtn.style.display = 'none';
                return;
            }

            emptyState.style.display = 'none';
            loadingState.style.display = 'none';

            const unread = data.notifications.filter(n => !n.is_read).length;
            if (unread > 0) {
                unreadAlert.style.display = 'flex';
                unreadCountDisplay.textContent = unread;
                markAllBtn.style.display = 'inline-block';
            } else {
                unreadAlert.style.display = 'none';
                markAllBtn.style.display = 'none';
            }

            let html = '';
            data.notifications.forEach(n => {
                const timeAgo = timeSince(n.timestamp);
                const unreadClass = n.is_read ? '' : 'border-start border-4 border-primary ps-2';
                const badgeHtml = n.is_read ? '' : '<span class="badge bg-primary rounded-pill">New</span>';

                html += `
                    <div class="list-group-item bg-transparent px-0 border-bottom d-flex justify-content-between align-items-start ${unreadClass}" data-id="${n.id}">
                        <div class="flex-grow-1">
                            <div class="d-flex align-items-center gap-2 mb-1">
                                ${badgeHtml}
                                <small class="text-muted">${timeAgo} ago</small>
                                <span class="badge bg-info bg-opacity-25 text-info">${escapeHtml(n.notification_type.replace(/_/g, ' '))}</span>
                            </div>
                            <p class="mb-1">${escapeHtml(n.message)}</p>
                        </div>
                        <div class="d-flex gap-1 ms-3">
                            ${n.is_read ? '' : `<button class="btn btn-sm btn-outline-primary mark-read-btn" data-id="${n.id}" title="Mark as read"><i class="fa-solid fa-check"></i></button>`}
                            <button class="btn btn-sm btn-outline-danger delete-btn" data-id="${n.id}" title="Delete"><i class="fa-solid fa-trash"></i></button>
                        </div>
                    </div>
                `;
            });
            container.innerHTML = html;

            document.querySelectorAll('.mark-read-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    fetch(`/notifications/api/mark-read/${id}/`, { method: 'POST', headers: {'X-CSRFToken': getCSRF()} })
                        .then(() => fetchNotifications());
                });
            });

            document.querySelectorAll('.delete-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    const id = this.dataset.id;
                    fetch(`/notifications/api/delete/${id}/`, { method: 'DELETE', headers: {'X-CSRFToken': getCSRF()} })
                        .then(() => fetchNotifications());
                });
            });
        });
}

document.getElementById('markAllReadBtn').addEventListener('click', function() {
    fetch('{% url "api_mark_all_read" %}', { method: 'POST', headers: {'X-CSRFToken': getCSRF()} })
        .then(() => fetchNotifications());
});

function timeSince(isoString) {
    const now = new Date();
    const then = new Date(isoString);
    const seconds = Math.floor((now - then) / 1000);
    if (seconds < 60) return 'just now';
    const minutes = Math.floor(seconds / 60);
    if (minutes < 60) return minutes + 'm';
    const hours = Math.floor(minutes / 60);
    if (hours < 24) return hours + 'h';
    const days = Math.floor(hours / 24);
    if (days < 30) return days + 'd';
    return Math.floor(days / 30) + 'mo';
}

function escapeHtml(text) {
    const div = document.createElement('div');
    div.textContent = text;
    return div.innerHTML;
}

function getCSRF() {
    const name = 'csrftoken';
    let cookieValue = null;
    if (document.cookie && document.cookie !== '') {
        document.cookie.split(';').forEach(c => {
            const trimmed = c.trim();
            if (trimmed.startsWith(name + '=')) {
                cookieValue = decodeURIComponent(trimmed.substring(name.length + 1));
            }
        });
    }
    return cookieValue;
}

fetchNotifications();
setInterval(fetchNotifications, 10000);
</script>
{% endblock %}
